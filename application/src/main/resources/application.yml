spring:
  application:
    name: ${INFRAPILOT_APP_NAME:InfraPilot}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/infrapilot}
    username: ${SPRING_DATASOURCE_USERNAME:infrapilot}
    password: ${SPRING_DATASOURCE_PASSWORD:infrapilot}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    banner-mode: "off"

server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    metrics:
      enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

info:
  app:
    name: ${INFRAPILOT_APP_NAME:InfraPilot}
    version: ${INFRAPILOT_APP_VERSION:0.0.0}
    commit: ${INFRAPILOT_GIT_COMMIT_SHA:unknown}
    build-timestamp: ${INFRAPILOT_BUILD_TIMESTAMP:unknown}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=InfraPilot correlationId=%X{correlationId:-} logger=%logger{36} message=%msg%n%ex{short}"
  level:
    root: INFO
    com.sumitverma.infrapilot: INFO

infrapilot:
  app-name: ${INFRAPILOT_APP_NAME}
  app-version: ${INFRAPILOT_APP_VERSION}
  git-commit-sha: ${INFRAPILOT_GIT_COMMIT_SHA}
  build-timestamp: ${INFRAPILOT_BUILD_TIMESTAMP}
  hostname: ${INFRAPILOT_HOSTNAME}
  environment: ${INFRAPILOT_ENVIRONMENT}