name: PR Validation

on:
  pull_request:
    branches:
      - main
      - stage
    paths:
      - 'src/**'
      - 'docker/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Capture build timestamp
        run: echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build, test, and measure coverage
        env:
          INFRAPILOT_APP_NAME: InfraPilot
          INFRAPILOT_APP_VERSION: ${{ github.event.pull_request.head.sha }}
          INFRAPILOT_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          INFRAPILOT_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
          INFRAPILOT_HOSTNAME: github-actions
          INFRAPILOT_ENVIRONMENT: pull-request
        run: mvn -B clean verify

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
