name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'application/**'
      - 'docker/**'
      - 'pom.xml'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build application jar
        env:
          INFRAPILOT_APP_NAME: InfraPilot
          INFRAPILOT_APP_VERSION: ${{ github.sha }}
          INFRAPILOT_GIT_COMMIT_SHA: ${{ github.sha }}
          INFRAPILOT_BUILD_TIMESTAMP: ${{ github.run_started_at }}
          INFRAPILOT_HOSTNAME: github-actions
          INFRAPILOT_ENVIRONMENT: build
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/infrapilot
          SPRING_DATASOURCE_USERNAME: infrapilot
          SPRING_DATASOURCE_PASSWORD: infrapilot
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          SPRING_REDIS_PASSWORD: infrapilot
        run: mvn -B -pl application -am clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: infrapilot
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
