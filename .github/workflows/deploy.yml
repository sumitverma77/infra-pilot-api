name: Deploy to ECS (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Environment
        required: true
        type: choice
        options:
          - prod
          - stage
        default: prod
      image_tag:
        description: Docker image tag to deploy (e.g., latest or commit SHA)
        required: true
        type: string
        default: latest

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download active task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.TASK_DEF_FAMILY }}" \
            --query taskDefinition > task-def.json

      - name: Render new task definition revision (Mutate App Image Only)
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ inputs.image_tag }}
          CONTAINER_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          jq --arg img "$IMAGE_URI" \
             --arg name "$CONTAINER_NAME" \
             'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
              | .containerDefinitions |= map(if .name == $name then .image = $img else . end)' \
             task-def.json > task-def-rendered.json

      - name: Register task definition & Update ECS service
        run: |
          aws ecs register-task-definition --cli-input-json file://task-def-rendered.json > task-def-register.json
          TASK_DEFINITION_ARN=$(jq -r '.taskDefinition.taskDefinitionArn' task-def-register.json)
          
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.SERVICE_NAME }}" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.SERVICE_NAME }}"

      - name: Verify dynamic health checks
        run: |
          ALB_DNS_NAME=$(aws elbv2 describe-load-balancers --names "${{ vars.ALB_NAME }}" --query "LoadBalancers[0].DNSName" --output text)
          curl -fsS "http://$ALB_DNS_NAME${{ vars.HEALTH_CHECK_PATH }}"
