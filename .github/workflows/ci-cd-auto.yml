name: Automated CI/CD Pipeline

on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'application/**'
      - 'docker/**'
      - 'pom.xml'
      - '.github/workflows/ci-cd-auto.yml'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build application jar
        env:
          INFRAPILOT_APP_NAME: InfraPilot
          INFRAPILOT_APP_VERSION: ${{ github.sha }}
          INFRAPILOT_GIT_COMMIT_SHA: ${{ github.sha }}
          INFRAPILOT_BUILD_TIMESTAMP: ${{ github.run_started_at }}
          INFRAPILOT_HOSTNAME: github-actions
          INFRAPILOT_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'stage' }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/infrapilot
          SPRING_DATASOURCE_USERNAME: infrapilot
          SPRING_DATASOURCE_PASSWORD: infrapilot
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          SPRING_REDIS_PASSWORD: infrapilot
        run: mvn -B -pl application -am clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.ref_name == 'main' && 'infrapilot-prod' || 'infrapilot-stage' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.ref_name == 'main' && 'prod' || 'stage' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve Environment Configuration
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ECS_CLUSTER=${{ vars.PROD_ECS_CLUSTER }}" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=${{ vars.PROD_ECS_SERVICE }}" >> "$GITHUB_ENV"
            echo "TASK_DEF_FAMILY=${{ vars.PROD_TASK_DEF_FAMILY }}" >> "$GITHUB_ENV"
            echo "ALB_DNS_NAME=${{ vars.PROD_ALB_DNS }}" >> "$GITHUB_ENV"
            echo "ECR_REPOSITORY=infrapilot-prod" >> "$GITHUB_ENV"
          else
            echo "ECS_CLUSTER=${{ vars.STAGE_ECS_CLUSTER }}" >> "$GITHUB_ENV"
            echo "ECS_SERVICE=${{ vars.STAGE_ECS_SERVICE }}" >> "$GITHUB_ENV"
            echo "TASK_DEF_FAMILY=${{ vars.STAGE_TASK_DEF_FAMILY }}" >> "$GITHUB_ENV"
            echo "ALB_DNS_NAME=${{ vars.STAGE_ALB_DNS }}" >> "$GITHUB_ENV"
            echo "ECR_REPOSITORY=infrapilot-stage" >> "$GITHUB_ENV"
          fi
          
          echo "CONTAINER_NAME=infrapilot" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${{ needs.build-and-push.outputs.registry }}" >> "$GITHUB_ENV"

      - name: Describe current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_FAMILY" \
            --query taskDefinition > task-def.json

      - name: Render new task definition revision
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ needs.build-and-push.outputs.image_tag }}"
          
          jq --arg img "$IMAGE_URI" \
             --arg name "$CONTAINER_NAME" \
             'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt)
              | .containerDefinitions |= map(if .name == $name then .image = $img else . end)' \
             task-def.json > task-def-rendered.json
          
          aws ecs register-task-definition --cli-input-json file://task-def-rendered.json > task-def-register.json
          echo "TASK_DEFINITION_ARN=$(jq -r '.taskDefinition.taskDefinitionArn' task-def-register.json)" >> "$GITHUB_ENV"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Verify health checks
        run: |
          curl -fsS "http://$ALB_DNS_NAME/actuator/health/readiness"
          curl -fsS "http://$ALB_DNS_NAME/api/v1/health"
